name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [pilot, lock, measure, backend]
        default: lock
permissions:
  contents: read
jobs:
  native:
    if: inputs.mode != 'measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
      - name: Acquire exact Agent lock subject
        if: inputs.mode == 'lock'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkersey/agent
          ref: 6c6a0675d833d5f31bcfb1f2b9910e39af66fb68
          path: lock-agent
          persist-credentials: false
      - name: Actual Agent dependency-lock mutation
        if: inputs.mode == 'lock'
        run: node test/experiments/zig17/lock_watch.mjs "$PWD/lock-agent"
      - name: Permanent external-consumer watcher regression
        if: inputs.mode == 'lock'
        run: AGENT_ZIG_EXE="$(command -v zig)" node --test --test-name-pattern='all source-override' lock-agent/test/agent4/consumer_build.test.mjs
      - name: Acquire frozen World backend subject
        if: inputs.mode == 'backend'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkersey/world
          ref: 50cc310d2027a1392ad1c864506300c3ab55f442
          path: backend-world
          persist-credentials: false
      - name: Alternate backend hard-gate comparison
        if: inputs.mode == 'backend'
        run: node test/experiments/zig17/backend_probe.mjs "$PWD/backend-world"
      - name: Linux incremental correctness pilot
        if: inputs.mode == 'pilot'
        run: node test/experiments/zig17/incremental.mjs
      - name: Retain experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig17-${{ inputs.mode }}-experiment
          path: |
            ${{ runner.temp }}/zig17-incremental-*/result.json
            ${{ runner.temp }}/zig17-incremental-*/*.log
            ${{ runner.temp }}/zig17-incremental-*/incremental.stderr
            ${{ runner.temp }}/zig17-lock-*/result.json
            ${{ runner.temp }}/zig17-lock-*/*.log
            ${{ runner.temp }}/zig17-lock-*/watch.stderr
            ${{ runner.temp }}/zig17-backend-*/result.json
            ${{ runner.temp }}/zig17-backend-*/*.log
          if-no-files-found: error
  measured:
    if: inputs.mode == 'measure'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        window: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
      - name: Paired persistent and fresh edit window
        env:
          E05_WINDOW: ${{ matrix.window }}
        run: node test/experiments/zig17/incremental_measure.mjs
      - name: Retain raw window and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zig17-incremental-window-${{ matrix.window }}
          path: |
            ${{ runner.temp }}/zig17-measured-*/result.json
            ${{ runner.temp }}/zig17-measured-*/*.log
            ${{ runner.temp }}/zig17-measured-*/incremental.stderr
          if-no-files-found: error
