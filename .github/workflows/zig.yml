name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
      - name: Linux incremental correctness pilot
        run: node test/experiments/zig17/incremental.mjs
      - name: Retain experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig17-incremental-pilot
          path: |
            ${{ runner.temp }}/zig17-incremental-*/result.json
            ${{ runner.temp }}/zig17-incremental-*/*.log
            ${{ runner.temp }}/zig17-incremental-*/incremental.stderr
          if-no-files-found: error
