name: Zig 0.17 qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# Superseded PR heads cannot qualify their successors. Preserve every main and
# manually requested run by giving non-PR events their own concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
          # The observed qualification cache exceeds the action's 2 GiB purge limit.
          cache-size-limit: 4096
      - name: Native and portable contracts
        run: zig build check -Doptimize=safe --summary all
      - name: Independent public package authoring
        run: node test/package_authoring.mjs --zig-exe "$(command -v zig)" --authoring-only
