name: Prepare audited test ablation
on:
  push:
    branches: [codex/test-ablation-prepare-20261004]
    paths: [.github/workflows/test-ablation-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6ea3f6fba0968a421f8e97b3de0de4454a4e8e2b
      - name: Apply hash-bound audited deletions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          ops = json.loads(r'''[
          {"path":"src/authoring_tests.zig","old":"1b922ea94a213fed922d5d2066f49edf2b252488","new":"6f41abc74fafb3ecdc15a3b11fabafa38431dd69","edits":[[18,26,""],[809,810,""],[838,842,""],[844,848,""],[1291,1295,""],[1334,1338,""],[1369,1373,""],[1425,1429,""],[1457,1461,""],[1496,1497,""],[1499,1503,""],[1549,1550,""],[1558,1562,""],[1613,1617,""],[1650,1651,""],[1653,1657,""],[1744,1748,""],[1773,1777,""],[1799,1800,""],[1802,1806,""],[1849,1853,""]]},
          {"path":"src/data/analysis_sets_tests.zig","old":"e523fe2f3ce51fb20290e1b2fd3f3904d28959db","new":"2e23ff640700b85547cad44d5503cd4ad0693f22","edits":[[213,225,""]]},
          {"path":"src/data/coalescing_tests.zig","old":"35e01539aa4bb53f6e24a7062ad69d0d7a7f5a9f","new":"3709bba7a940499c2437ff88f71c159e43cc64f3","edits":[[6,11,""]]},
          {"path":"src/data/program_image_tests.zig","old":"43f89f9b2fdba40534a5ac000051b2296d1a4f9d","new":"d8624afd292557324c6e78b6948fed0b03afeb59","edits":[[341,342,"test \"accepted handler bytes and retired wire tags stay fixed\" {\n"],[344,347,""]]},
          {"path":"src/library/generator.zig","old":"ce6f11889875679b184129540f294a92478bd4af","new":"e12272c148acce735a75c27b9b9420fc15962d7f","edits":[[170,181,""],[280,300,""]]},
          {"path":"src/library/scheduler.zig","old":"980e193e9dcd7123570ea602cd5807f7d88d9299","new":"d7a1b441f6df0399384fdcb4da115587e7ada4a5","edits":[[97,98,"fn constructionCase(allocator: std.mem.Allocator) !void {\n"],[116,118,"test \"typed scheduler construction shares definitions\" {\n    try constructionCase(std.testing.allocator);\n"]]},
          {"path":"test/package_authoring/rejection.zig","old":"0a05febf9ae3967bdb55d7d6991404b5eccd7691","new":"ef3431b42855a7fdd08cba7eedbf99978cc6670a","edits":[[2,23,""]]}
          ]''')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for op in ops:
              p = Path(op['path'])
              data = p.read_bytes()
              assert blob(data) == op['old'], op['path']
              lines = data.decode().splitlines(keepends=True)
              for start, end, text in reversed(op['edits']):
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode()
              assert blob(result) == op['new'], op['path']
              p.write_bytes(result)
          PY
          git add -u
          git diff --cached --check
          test "$(git write-tree)" = "e80726526afcbb0b854433ff56243de513fa7144"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Ablate redundant construction sweeps and implementation-shaped tests'
          git push origin HEAD:refs/heads/codex/test-ablation-candidate-20261004
