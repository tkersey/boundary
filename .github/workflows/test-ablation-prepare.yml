name: Prepare reviewed test ablation
on:
  push:
    branches: [codex/test-ablation-prepare-20261004]
    paths: [.github/workflows/test-ablation-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6ea3f6fba0968a421f8e97b3de0de4454a4e8e2b
      - name: Apply exact audited patch to immutable parent
        env:
          PATCH: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH" | base64 -d | gzip -d > "$RUNNER_TEMP/ablation.patch"
          echo "7b65316b13f559cfce910bc5ef071d7c8ab43e90979cf4b4b78168dd2d79ba46  $RUNNER_TEMP/ablation.patch" | sha256sum -c -
          test "$(git rev-parse HEAD)" = "6ea3f6fba0968a421f8e97b3de0de4454a4e8e2b"
          git apply --check --index "$RUNNER_TEMP/ablation.patch"
          git apply --index "$RUNNER_TEMP/ablation.patch"
          git diff --cached --check
          test "$(git write-tree)" = "e80726526afcbb0b854433ff56243de513fa7144"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Ablate redundant test definitions and retired scaffolding'
          git push origin HEAD:refs/heads/codex/test-ablation-candidate-20261004
          printf '{"parent":"%s","commit":"%s","tree":"%s","patchSha256":"%s"}\n' '6ea3f6fba0968a421f8e97b3de0de4454a4e8e2b' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" '7b65316b13f559cfce910bc5ef071d7c8ab43e90979cf4b4b78168dd2d79ba46' > "$RUNNER_TEMP/ablation-commit.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ablation-prepared-commit
          path: ${{ runner.temp }}/ablation-commit.json
          if-no-files-found: error
          retention-days: 3
